<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x2peakz — bio</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png"> <!-- ไอคอนตอน Add to Home Screen บน iOS -->

<!-- LINE Seed Sans TH webfont -->
<link href="https://db.onlinewebfonts.com/c/0a54bd29f535bbdd5c69fdd2976d7b66?family=LINE+Seed+Sans+TH" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/NotoSansThai/NotoSansThai.css" rel="stylesheet">

<style>
  :root{
    --bg:#0A0505;
    --card:rgba(28,12,12,.55);
    --card-2:rgba(36,14,14,.5);
    --line:rgba(255,90,90,.12);
    --text-1:#F5EDED;
    --text-2:#A88F8F;
    --accent:#FF3B3B;
    --accent-rgb:255,59,59;
    --online:#3BD671;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-1);
    font-family:'LINE Seed Sans TH','Noto Sans Thai','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:6px 0 18px;}
  .topbar .site{
    font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--text-1);
    animation:textGlow 3.2s ease-in-out infinite;
  }
  .views{
    position:absolute;right:0;top:0;
    display:flex;align-items:center;
  }

  /* ---------- profile card ---------- */
  .profile-card{
    background:var(--card);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:26px 22px 22px;
    position:relative;
    box-shadow:0 0 40px rgba(var(--accent-rgb),.12);
  }
  .profile-header{display:flex;align-items:stretch;gap:12px;margin-bottom:16px;}
  .avatar-wrap{
    width:96px;height:96px;border-radius:var(--radius-md);
    overflow:hidden;flex-shrink:0;
    box-shadow:0 0 0 1px var(--line), 0 0 30px rgba(var(--accent-rgb),.35);
  }
  .avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .banner-wrap{
    flex:1;min-width:0;height:96px;border-radius:var(--radius-md);
    overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 0 30px rgba(var(--accent-rgb),.25);
    background:linear-gradient(135deg,#3A0000 0%,#0A0505 60%,#1A0000 100%);
  }
  .banner-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .name{
    font-size:26px;font-weight:800;margin:0 0 8px;
    animation:textGlow 3.2s ease-in-out infinite;
  }

  /* ---------- text glow animation ---------- */
  @keyframes textGlow{
    0%,100%{
      text-shadow:0 0 6px rgba(var(--accent-rgb),.15), 0 0 1px rgba(var(--accent-rgb),.1);
    }
    50%{
      text-shadow:0 0 16px rgba(var(--accent-rgb),.55), 0 0 4px rgba(var(--accent-rgb),.35);
    }
  }
  .bio{color:var(--text-2);font-size:14.5px;line-height:1.75;margin:0;}
  .bio .mono{color:#FF8080;font-family:inherit;}

  .link-list{display:flex;flex-direction:column;gap:5px;margin-top:12px;}
  .link-btn{
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:#E42E2E;
    border:1px solid rgba(255,255,255,.15);
    border-radius:7px;
    padding:5px 7px;
    font-size:10px;font-weight:700;color:#fff;
    box-shadow:0 2px 5px rgba(var(--accent-rgb),.3);
    transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;
  }
  .link-btn svg{width:11px;height:11px;flex-shrink:0;stroke:#fff;}
  .link-btn:hover{filter:brightness(1.08);}
  .link-btn:active{transform:scale(.97);}

  .social-row{
    display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
    margin-top:18px;
    background:var(--card-2);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px;
  }
  .social-btn{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .social-btn svg{width:18px;height:18px;}
  .social-btn:hover{transform:translateY(-2px);box-shadow:0 0 14px rgba(var(--accent-rgb),.3);}

  /* ---------- section cards ---------- */
  .section-card{
    background:var(--card);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:16px 17px;
    margin-top:14px;
  }
  .section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--text-2);margin-bottom:11px;font-weight:700;
  }

  /* discord */
  .discord-row{display:flex;align-items:center;gap:12px;}
  .discord-icon{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--card-2);flex-shrink:0;}
  .discord-info{flex:1;min-width:0;}
  .discord-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .discord-info .gname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .discord-substats{
    display:flex;align-items:center;gap:5px;margin-top:4px;
    font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .discord-substats b{color:var(--text-1);font-weight:700;}
  .discord-substats .sep{color:var(--line);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--online);display:inline-block;flex-shrink:0;}
  .join-btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:4px 8px;border-radius:6px;
    background:#E42E2E;
    border:1px solid rgba(255,255,255,.15);
    color:#fff;font-weight:700;font-size:9px;
    flex-shrink:0;
    box-shadow:0 2px 5px rgba(var(--accent-rgb),.35);
    transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;
  }
  .join-btn:hover{filter:brightness(1.08);}
  .join-btn:active{transform:scale(.96);}

  /* roblox */
  .roblox-row{display:flex;align-items:center;gap:16px;}
  .rbx-avatar{width:76px;height:104px;border-radius:var(--radius-sm);background:var(--card-2);object-fit:contain;flex-shrink:0;}
  .rbx-info{flex:1;min-width:0;}
  .rbx-info .rname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rbx-info .rtag{color:var(--text-2);font-size:12.5px;margin-top:2px;}
  .rbx-stats{display:flex;gap:10px;margin-top:12px;}
  .rbx-stat{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 6px;
  }
  .rbx-stat b{color:var(--text-1);font-size:16px;font-weight:800;line-height:1;}
  .rbx-stat .rbx-stat-label{color:var(--text-2);font-size:11px;display:flex;align-items:center;gap:4px;}
  .rbx-stat svg{width:12px;height:12px;stroke:var(--accent);}

  .website-card{
    display:flex;align-items:center;gap:12px;
    background:var(--card-2);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .website-card:hover{border-color:rgba(var(--accent-rgb),.5);box-shadow:0 0 18px rgba(var(--accent-rgb),.18);}
  .website-logo{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--card);flex-shrink:0;}
  .website-info{flex:1;min-width:0;}
  .website-info .wtitle{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .website-info .wdesc{font-size:11px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .website-info .wurl{font-size:11px;color:var(--accent);margin-top:2px;word-break:break-all;}
  .website-card svg{flex-shrink:0;width:14px;height:14px;color:var(--text-2);}

  .state{font-size:13px;color:var(--text-2);padding:6px 0;}
  .err{color:#FF8080;}

  footer{text-align:center;margin-top:26px;color:var(--text-2);font-size:12px;}

  @media (max-width:380px){
    .name{font-size:22px;}
  }
</style>
</head>

<script>
/* ============================================================

  // พื้นหลังเว็บ — ใส่ได้ทั้งรูป / วิดีโอไฟล์ตรง / ลิงก์ embed จาก CDN (เช่น Cloudinary player, ลิงก์ embed อื่นๆ)

const ICONS = {

  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L23 6H6"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 6.9-1L12 2Z"/>',
  external: '<path d="M7 17 17 7M7 7h10v10"/>'

const SOCIAL_ICONS = {
  telegram: '<path d="m22 2-20 7.5 6 3M22 2l-3.5 18-6.5-5M22 2 10.5 15.5m0 0L8 22l2.5-6.5"/>',
  facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3Z"/>',
  instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/>',
  tiktok: '<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>',
  youtube: ICONS.youtube,
  discord: '<path d="M9 12a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/><path d="M7 5C4 6 3 9 3 15c0 0 2 3 6 3l1-2M17 5c3 1 4 4 4 10 0 0-2 3-6 3l-1-2M7 5c2-1 3-1 5-1s3 0 5 1M7 16c1.5 1 3 1.3 5 1.3s3.5-.3 5-1.3"/>'
};

function svg(pathHtml, extraClass=""){
  return `<svg class="${extraClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${pathHtml}</svg>`;
}

function formatCompact(n){
  return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
}

function render(){
  document.getElementById('siteTitle').textContent = CONFIG.siteTitle;
  document.title = CONFIG.siteTitle + ' — Links';
  document.getElementById('avatarImg').src = CONFIG.profile.avatar;
  const bannerWrap = document.getElementById('bannerWrap');
  bannerWrap.innerHTML = CONFIG.profile.banner ? `<img src="${CONFIG.profile.banner}" alt="banner">` : '';
  document.getElementById('profileName').textContent = CONFIG.profile.name;
  document.getElementById('profileBio').innerHTML = CONFIG.profile.bioHTML;

  const linkList = document.getElementById('linkList');
  linkList.innerHTML = CONFIG.links.map(l => `
    <a class="link-btn" href="${l.url}" target="_blank" rel="noopener">
      ${svg(ICONS[l.icon] || ICONS.external)}
      <span>${l.label}</span>
    </a>
  `).join('');

  const socialRow = document.getElementById('socialRow');
  socialRow.innerHTML = CONFIG.socials.map(s => `
    <a class="social-btn" href="${s.url}" target="_blank" rel="noopener" aria-label="${s.platform}">
      ${svg(SOCIAL_ICONS[s.platform] || ICONS.external)}
    </a>
  `).join('');

}

/* ---------------- View counter (hits.seeyoufarm.com badge) ---------------- */
function loadViewCounter(){
  const badge = document.getElementById('viewBadge');
  const viewsBox = document.getElementById('viewsBox');

/* ---------------- Roblox profile ---------------- */
async function loadRoblox(){
  const box = document.getElementById('robloxBox');
  if (!CONFIG.roblox.username) {
    box.innerHTML = `<div class="state">ยังไม่ได้ใส่ username Roblox (แก้ที่ CONFIG.roblox.username)</div>`;
    return;
  }

  box.innerHTML = `<div class="state">กำลังโหลดโปรไฟล์ Roblox…</div>`;

  // ใช้ proxy ตัวเดียว (RoProxy) เท่านั้น เพื่อไม่ให้หลาย proxy ยิงพร้อมกันแล้วแย่ง/ทับกัน
  // RoProxy: proxy เฉพาะทาง Roblox โดยตรง เปิด CORS ให้เองอยู่แล้ว เชื่อถือได้สุด
  const PROXIES = [
    (url) => url.replace(/^https:\/\/([a-z0-9-]+)\.roblox\.com/, 'https://$1.roproxy.com')
  ];

  const TIMEOUT_MS = 8000; // กันไม่ให้ค้างถ้า proxy ไม่ตอบสนอง

  async function fetchWithTimeout(url, options = {}){
    // หมายเหตุ: เดิมใช้ AbortController + signal ส่งเข้า fetch() โดยตรง แต่บาง environment (เช่นตอน preview
    // ที่ดัก fetch ผ่าน postMessage ไปยัง frame อื่น) เอา AbortSignal ไป structured-clone ไม่ได้ ทำให้ fetch พังเงียบๆ
    // ทุก proxy พร้อมกันด้วย error เดียวกันหมด ("AbortSignal object could not be cloned")
    // แก้โดยใช้ Promise.race แทน ไม่ส่ง signal เข้า fetch เลย จะได้ไม่มี object แปลกๆ หลุดเข้าไปให้ clone พัง
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('timeout')), TIMEOUT_MS);
    });
    const fetchPromise = (async () => {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error('bad status ' + res.status);
      const json = await res.json();
      // allorigins ห่อผลลัพธ์ไว้ใน .contents บางกรณี (ตอบเป็น text) — เผื่อไว้
      if (json && typeof json.contents === 'string') {
        try { return JSON.parse(json.contents); } catch { return json; }
      }
      return json;
    })();
    return Promise.race([fetchPromise, timeoutPromise]);
  }

  // ยิงทุก proxy พร้อมกันในคราวเดียว (แทนที่จะรอทีละตัวตามลำดับ) ตัวไหนสำเร็จก่อนก็ใช้ตัวนั้น
  // เร็วกว่าแบบเดิมมาก และรับประกันว่าจะเห็นผลของ proxy ทุกตัวจริงๆ ไม่ใช่แค่ตัวแรก
  const debugLog = [];
  async function fetchViaProxy(targetUrl, options = {}){
    const attempts = PROXIES.map(async (makeProxyUrl) => {
      const proxyUrl = makeProxyUrl(targetUrl);
      const proxyHost = new URL(proxyUrl).hostname;
      try {
        const result = await fetchWithTimeout(proxyUrl, options);
        debugLog.push(`✅ ${proxyHost} → OK`);
        return result;
      } catch (e) {
        debugLog.push(`❌ ${proxyHost} → ${e.message === 'timeout' ? 'timeout' : e.message}`);
        throw e;
      }
    });
    try {
      return await Promise.any(attempts);
    } catch (aggErr) {
      throw new Error('all proxies failed');
    }
  }

  async function resolveRobloxUser(username){
    // ใช้ endpoint ค้นหาแบบ GET (users.roblox.com/v1/users/search) แทนตัวเก่าที่เป็น POST
    // เพราะ proxy ฟรีส่วนใหญ่ (allorigins, codetabs, cors.lol ฯลฯ) forward ได้แค่ GET
    // ไม่ส่ง body ของ POST ต่อให้ ทำให้วิธีเดิมพังเงียบๆ บน proxy พวกนี้
    try {
      const json = await fetchViaProxy(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`);
      const list = json?.data || [];
      const exact = list.find(u => (u.name || '').toLowerCase() === username.toLowerCase());
      const u = exact || list[0];
      if (u) return { Id: u.id, Username: u.name, DisplayName: u.displayName || u.name };
    } catch (e) { /* fall through */ }

    // fallback: endpoint เก่ามาก (บางครั้ง Roblox ยังรับอยู่กับบาง username) — เผื่อไว้เฉยๆ
    try {
      const json = await fetchViaProxy(`https://api.roblox.com/users/get-by-username?username=${encodeURIComponent(username)}`);
      if (json && json.Id) return { Id: json.Id, Username: json.Username, DisplayName: json.Username };
    } catch (e) { /* fall through */ }

    throw new Error('user not found');
  }

  try {
    const user = await resolveRobloxUser(CONFIG.roblox.username);

    // ให้แต่ละ stat ล้มเหลวแยกกันได้ — ถ้าเพื่อน/ผู้ติดตาม/รูปโหลดไม่ได้ ก็ยังโชว์ที่เหลือ แทนที่จะพังทั้งบล็อก
    const [friends, followers, thumb] = await Promise.all([
      fetchViaProxy(`https://friends.roblox.com/v1/users/${user.Id}/friends/count`).catch(() => ({ count: null })),
      fetchViaProxy(`https://friends.roblox.com/v1/users/${user.Id}/followers/count`).catch(() => ({ count: null })),
      fetchViaProxy(`https://thumbnails.roblox.com/v1/users/avatar?userIds=${user.Id}&size=150x200&format=Png&isCircular=false`).catch(() => null)
    ]);
    const avatarUrl = thumb?.data?.[0]?.imageUrl || 'https://placehold.co/150x200/240E0E/FF3B3B?text=RBX';
    const friendsText = friends.count == null ? '—' : formatCompact(friends.count);
    const followersText = followers.count == null ? '—' : formatCompact(followers.count);

    box.innerHTML = `
      <div class="roblox-row">
        <img class="rbx-avatar" src="${avatarUrl}" alt="${user.Username}">
        <div class="rbx-info">
          <div class="rname">${user.DisplayName}</div>
          <div class="rtag">@${user.Username}</div>
          <div class="rbx-stats">
            <div class="rbx-stat">
              <b>${friendsText}</b>
              <span class="rbx-stat-label">${svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>')} เพื่อน</span>
            </div>
            <div class="rbx-stat">
              <b>${followersText}</b>
              <span class="rbx-stat-label">${svg('<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>')} ผู้ติดตาม</span>
            </div>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    console.error('Roblox load failed:', e, debugLog); // รายละเอียด proxy ไหนพัง/ผ่าน ดูได้ใน console (F12) ไม่โชว์ให้ผู้ใช้ทั่วไปเห็นบนหน้าเว็บ
    box.innerHTML = `
      <div class="state err">
        โหลดโปรไฟล์ Roblox ไม่สำเร็จ ลองใหม่อีกครั้ง
        <div>
          <button id="rbxRetryBtn" class="join-btn" style="margin-top:8px;cursor:pointer;border:none;">ลองใหม่</button>
        </div>
      </div>
    `;
    document.getElementById('rbxRetryBtn')?.addEventListener('click', loadRoblox);
  }
}

/* ---------------- พื้นหลังเว็บ (รูป/วิดีโอ/ลิงก์ embed จาก CDN) ---------------- */
function setupBackground(){
  const bg = CONFIG.background;
  if (!bg || bg.type === 'none' || !bg.url) return;

  const wrap = document.createElement('div');
  wrap.id = 'bgWrap';
  // scale(1.08) กันขอบภาพเบลอโผล่ให้เห็นเป็นแถบขาว/ใส เวลาใส่ filter:blur ที่ inset:0 พอดีจอ
  const blurPx = typeof bg.blur === 'number' ? bg.blur : 0;
  wrap.style.cssText = `position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg);${blurPx ? `filter:blur(${blurPx}px);transform:scale(1.08);` : ''}`;

  if (bg.type === 'video') {
    // ลิงก์ไฟล์วิดีโอตรง (.mp4/.webm) เท่านั้น — object-fit:cover ซูม/ครอปให้เต็มจอเองไม่ว่าอัตราส่วนจอจะเป็นแนวไหน
    wrap.innerHTML = `<video autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;"><source src="${bg.url}"></video>`;
  } else if (bg.type === 'iframe') {
    // ลิงก์ embed/player จาก CDN ต่างๆ (Cloudinary player, YouTube embed ฯลฯ) เป็น iframe (หน้าเว็บ) ไม่ใช่ไฟล์มีเดียตรง
    // เบราว์เซอร์ครอป iframe ด้วย object-fit ไม่ได้ ต้องคำนวณขนาด+ซูมเอง ให้เต็มจอเสมอ ไม่มีขอบ/แถบดำ ทั้งมือถือแนวตั้งและคอมจอกว้าง
    const iframe = document.createElement('iframe');
    iframe.src = bg.url;
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    iframe.frameBorder = '0';
    iframe.style.cssText = 'position:absolute;top:50%;left:50%;border:0;pointer-events:none;transform:translate(-50%,-50%);';
    wrap.appendChild(iframe);

    const aspect = bg.aspectRatio || (16/9);
    const resizeIframe = () => {
      const w = window.innerWidth, h = window.innerHeight;
      const screenAspect = w / h;
      if (screenAspect > aspect) {
        // จอกว้างกว่าวิดีโอ (เช่นคอมจอกว้าง) -> ยึดความกว้างจอ แล้วให้ความสูงเกินจอไปเลย (ซูม)
        iframe.style.width = w + 'px';
        iframe.style.height = Math.ceil(w / aspect) + 'px';
      } else {
        // จอแคบกว่าวิดีโอ (เช่นมือถือแนวตั้ง กับวิดีโอแนวนอน) -> ยึดความสูงจอ แล้วให้ความกว้างเกินจอไปเลย (ซูม)
        iframe.style.height = h + 'px';
        iframe.style.width = Math.ceil(h * aspect) + 'px';
      }
    };
    resizeIframe();
    window.addEventListener('resize', resizeIframe);
    window.addEventListener('orientationchange', resizeIframe);
  } else {
    wrap.innerHTML = `<img src="${bg.url}" style="width:100%;height:100%;object-fit:cover;" alt="">`;
  }

  // ฉาบสีมืดบางๆ ทับพื้นหลัง กันตัวหนังสือ/การ์ดอ่านยากตอนพื้นหลังสว่างหรือมีรายละเอียดเยอะ
  const overlay = document.createElement('div');
  overlay.id = 'bgOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:-1;background:rgba(10,5,5,.45);';

  document.body.prepend(overlay);
  document.body.prepend(wrap);
}

/* ---------------- เพลงพื้นหลัง (YouTube / TikTok) ---------------- */
function getYouTubeId(url){
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
    if (m) return m[2];
  } catch (e) { /* invalid url */ }
  return null;
}
function getTikTokVideoId(url){
  const m = url.match(/video\/(\d+)/);
  return m ? m[1] : null;
}

/* หน้าจอเบลอๆ พร้อมข้อความ "แตะเพื่อเล่นเพลง" กลางจอ — หายไปทันทีที่แตะ/คลิก แล้วค่อยปลดเสียงเพลง */
function showTapToPlayOverlay(onUnlock){
  const overlay = document.createElement('div');
  overlay.id = 'musicTapOverlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,5,5,.35);
    backdrop-filter:blur(24px) saturate(120%);
    -webkit-backdrop-filter:blur(24px) saturate(120%);
    cursor:pointer;
    touch-action:none;
    transition:opacity .4s ease;
  `;
  overlay.innerHTML = `
    <div style="text-align:center;padding:0 24px;">
      <div style="width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div style="font-size:14.5px;font-weight:700;color:var(--text-1);">แตะหน้าจอเพื่อเล่นเพลง</div>
      <div style="font-size:12px;color:var(--text-2);margin-top:5px;">Tap anywhere to start the music</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // กันปัญหา "แตะทะลุ" บนมือถือ: เบราว์เซอร์มือถือจะยิง event click สังเคราะห์ตามมาหลัง touchstart/touchend
  // เดิมพอ overlay ปิดตัว (pointer-events:none) ไปแล้ว click สังเคราะห์นี้เลยทะลุไปโดนปุ่มเมนูข้างล่างแทน กดพาไปหน้าอื่นเลย
  // แก้โดยฟัง touchend + เรียก preventDefault() ซึ่งจะบล็อกไม่ให้เบราว์เซอร์ยิง click สังเคราะห์ตามมาอีก (พฤติกรรมมาตรฐานของ touch events)
  let dismissed = false;
  const dismiss = (e) => {
    if (dismissed) return;
    dismissed = true;
    if (e && e.cancelable) e.preventDefault();
    if (e) e.stopPropagation();
    try { onUnlock && onUnlock(); } catch (e) { /* player not ready yet */ }
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => overlay.remove(), 400);
  };
  overlay.addEventListener('touchend', dismiss, { passive: false });
  overlay.addEventListener('click', dismiss); // สำหรับคอม/เมาส์ ซึ่งไม่มี touch event มากวนอยู่แล้ว
}

function setupMusic(){
  const music = CONFIG.music;
  if (!music || music.type === 'none' || !music.url) return;

  // เบราว์เซอร์บล็อกเสียงอัตโนมัติเสมอจนกว่าจะมีการโต้ตอบกับหน้าเว็บ (คลิก/แตะ) — เป็นกฎของเบราว์เซอร์ แก้จากโค้ดไม่ได้
  // กลยุทธ์: เล่นแบบเงียบอัตโนมัติทันที แล้วโชว์หน้าจอเบลอ "แตะเพื่อเล่นเพลง" กลางจอ พอผู้ใช้แตะ/คลิกก็ปลดเสียงพร้อมซ่อนข้อความนั้นไปเลย

  if (music.type === 'youtube') {
    const videoId = getYouTubeId(music.url);
    if (!videoId) return;

    const holder = document.createElement('div');
    holder.id = 'ytMusicPlayer';
    holder.style.cssText = 'position:fixed;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;';
    document.body.appendChild(holder);

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);

    let ytPlayer = null;
    window.onYouTubeIframeAPIReady = function(){
      ytPlayer = new YT.Player('ytMusicPlayer', {
        videoId,
        playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: videoId },
        events: {
          onReady: (e) => { e.target.playVideo(); } // เริ่มแบบเงียบก่อน — ไม่ใส่ mute:1 บางเบราว์เซอร์จะไม่เล่นให้เลย
        }
      });
    };

    const unlockAudio = () => {
      try { ytPlayer && ytPlayer.unMute(); ytPlayer && ytPlayer.playVideo(); } catch (e) { /* player not ready yet */ }
    };
    showTapToPlayOverlay(unlockAudio);
  }

  if (music.type === 'tiktok') {
    const videoId = getTikTokVideoId(music.url);
    if (!videoId) return;

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.tiktok.com/embed/v2/${videoId}?autoplay=1&loop=1&controls=0&music_info=0&description=0`;
    iframe.allow = 'autoplay';
    iframe.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;';
    document.body.appendChild(iframe);
    // หมายเหตุ: TikTok ฝังเป็น iframe ข้ามโดเมน สั่ง mute/unmute จากภายนอกไม่ได้เหมือน YouTube
    // เสียงจะออกได้จริงแค่ไหนขึ้นกับ TikTok เอง — ถ้าอยากคุมเสียงได้แน่นอน แนะนำใช้ YouTube แทน
    // ยังคงโชว์หน้าจอ "แตะเพื่อเล่นเพลง" ให้ผู้ใช้แตะก่อน เพื่อเป็นการโต้ตอบครั้งแรกกับหน้าเว็บ (อาจช่วยให้ TikTok ปลดเสียงได้ในบางเบราว์เซอร์)
    showTapToPlayOverlay(null);
  }
}

render();
loadViewCounter();
loadDiscord();
loadRoblox();
loadWebsite();
setupBackground();
setupMusic();
</script>
